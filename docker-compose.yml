services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    networks:
      - neurocredit-network

networks:
  neurocredit-network:
    driver: bridge
